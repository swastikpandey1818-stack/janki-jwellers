name: Build Android APK

# Runs every time you push to GitHub, or when you tap "Run workflow" in the Actions tab.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # PINNED on purpose: this is the exact Flutter version the app was built
          # and tested with on your PC (Gradle 9.1.0 in android/gradle/wrapper).
          # Using "latest stable" broke the build when Flutter started requiring a
          # newer Gradle. To upgrade later, change this AND the Gradle version
          # in android/gradle/wrapper/gradle-wrapper.properties together.
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Show versions (helps debugging)
        run: |
          flutter --version
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties

      - name: Get packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Shree-Janki-Jewellers-v1.9.0.apk

      - name: Save the APK so you can download it
        uses: actions/upload-artifact@v4
        with:
          name: shree-janki-v1.9.0-apk
          path: Shree-Janki-Jewellers-v1.9.0.apk
          if-no-files-found: error
